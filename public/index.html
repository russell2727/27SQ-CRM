<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="27SQ CRM">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<title>27 Squared CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --magenta:#EC008C; --black:#000000; --grey:#636466;
  --bg:#FFFFFF; --panel:#F6F6F7; --line:#E2E2E5; --ink:#000000; --ink2:#636466; --ink3:#9C9DA1;
  --won:#1F9D55; --lost:#B42318; --warn:#B45309;
  --hd:'Archivo',Arial,sans-serif; --body:'Hanken Grotesk',Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#141416; --panel:#1E1E21; --line:#2E2E33; --ink:#F2F2F3; --ink2:#A9AAAF; --ink3:#6E6F75; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--body);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{font-family:var(--hd);font-weight:800;text-transform:uppercase;letter-spacing:.01em;margin:0}
h1{font-size:22px} h2{font-size:17px} h3{font-size:13px;color:var(--ink2)}

.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.rail{border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px}
.bug{display:grid;grid-template-columns:1fr 1fr;width:30px;height:30px;flex:none}
.bug span{display:flex;align-items:center;justify-content:center;font-family:var(--hd);font-size:10px;line-height:1;color:#fff;background:var(--black)}
.bug span:nth-child(2),.bug span:nth-child(3){background:var(--magenta)}
@media (prefers-color-scheme:dark){.bug span{background:#fff;color:#000}.bug span:nth-child(2),.bug span:nth-child(3){background:var(--magenta);color:#fff}}
.brand b{font-family:var(--hd);font-size:15px;text-transform:uppercase}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:11px;color:var(--ink2);text-transform:none;letter-spacing:0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:9px 10px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;font-weight:500}
.nav button:hover{background:var(--panel)}
.nav button[aria-current]{background:var(--black);color:#fff}
@media (prefers-color-scheme:dark){.nav button[aria-current]{background:#fff;color:#000}}
.nav button .n{font-size:12px;opacity:.6}
.nav button .n.due{opacity:1;color:var(--magenta);font-weight:600}
.nav button[aria-current] .n.due{color:inherit}
.rail .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink2)}
.rail .foot .who{color:var(--ink);font-weight:500;font-size:13px}
.rail .foot button{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.rail .foot button:hover{color:var(--magenta)}

main{padding:22px 26px 60px;min-width:0;position:relative;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{border:1px solid var(--line);background:var(--bg);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--magenta);border-color:var(--magenta);color:#fff}
.btn.primary:hover{background:#C9007A;border-color:#C9007A}
.btn.danger{color:var(--lost)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.nav button:focus-visible,.card:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px}
input[type=checkbox]{width:auto;padding:0;margin:0 6px 0 0;vertical-align:-2px;accent-color:var(--magenta)}
textarea{min-height:80px;resize:vertical}
.search{max-width:300px}
label{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px;font-weight:500}
label.inline{display:flex;align-items:center;font-size:14px;color:var(--ink);cursor:pointer}
.field{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--black);color:#fff}
@media (prefers-color-scheme:dark){.seg button[aria-pressed="true"]{background:#fff;color:#000}}
.note{font-size:13px;color:var(--ink2)}
.warnbox{border:1px solid var(--warn);color:var(--warn);border-radius:6px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.okbox{border:1px solid var(--won);color:var(--won);border-radius:6px;padding:10px 12px;font-size:13px;margin-bottom:12px}
code{background:var(--panel);padding:1px 5px;border-radius:4px;font-size:13px;word-break:break-all}

.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--panel);border-radius:8px;padding:10px;min-height:300px;display:flex;flex-direction:column;gap:8px}
.col.over{outline:2px dashed var(--magenta);outline-offset:-2px}
.colhead{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 6px}
.colhead h3{color:var(--ink)}
.colhead .sum{font-size:12px;color:var(--ink2)}
.card{background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--grey);border-radius:6px;padding:10px 12px;cursor:pointer}
.card:hover{border-color:var(--ink2);border-left-color:var(--magenta)}
.card.dragging{opacity:.4}
.card .nm{font-weight:600}
.card .co{font-size:13px;color:var(--ink2)}
.card .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-top:6px;gap:6px}
.card .val{color:var(--ink);font-weight:500}
.card .sig{color:var(--magenta)}
.card .sig.done{color:var(--won)}
.empty{color:var(--ink3);font-size:13px;padding:12px 4px;text-align:center}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--ink2);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.rowlink{cursor:pointer}
tr.rowlink:hover td{background:var(--panel)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--panel);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.tag.won{color:var(--won);border-color:var(--won)}
.tag.lost{color:var(--lost);border-color:var(--lost)}
.tag.stage{color:var(--ink)}
.tag.admin,.tag.m{color:var(--magenta);border-color:var(--magenta)}
.muted{color:var(--ink2)}
.bigempty{padding:60px 20px;text-align:center;color:var(--ink2);border:1px dashed var(--line);border-radius:8px}
.bigempty p{margin:0 0 12px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px}
.kpi{border-top:3px solid var(--black);padding:12px 0 0}
@media (prefers-color-scheme:dark){.kpi{border-top-color:#fff}}
.kpi .v{font-family:var(--hd);font-size:30px;line-height:1}
.kpi .l{font-size:13px;color:var(--ink2);margin-top:6px}
.kpi.accent{border-top-color:var(--magenta)}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.panel{min-width:0}
.panel h3{margin-bottom:10px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:150px 1fr 70px;align-items:center;gap:10px;font-size:13px}
.bar .track{height:10px;background:var(--panel);border-radius:2px;overflow:hidden}
.bar .fill{height:100%;background:var(--black)}
.bar .fill.m{background:var(--magenta)}
@media (prefers-color-scheme:dark){.bar .fill{background:#fff}.bar .fill.m{background:var(--magenta)}}
.bar .n{text-align:right;color:var(--ink2)}
.chart svg{width:100%;height:170px;display:block}
.fstep{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:13px;margin-bottom:6px}
.fstep .f{height:22px;background:var(--black);border-radius:2px;min-width:2px}
@media (prefers-color-scheme:dark){.fstep .f{background:#fff}}
.fstep .pct{text-align:right;color:var(--ink2)}

.tasklist .task{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.tasklist .task.done .t{text-decoration:line-through;color:var(--ink3)}
.tasklist .task .sub{font-size:12px;color:var(--ink2);margin-top:2px}
.tasklist .task .sub a{cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.tasklist .due.over{color:var(--lost);font-weight:600}
.tasklist .due.today{color:var(--magenta);font-weight:600}
.tasklist h3{margin:18px 0 6px}
.tasklist .task .x{all:unset;cursor:pointer;color:var(--ink3);padding:0 4px}
.tasklist .task .x:hover{color:var(--lost)}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:20}
.scrim.open{display:block}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(600px,100vw);background:var(--bg);border-left:1px solid var(--line);z-index:21;transform:translateX(100%);transition:transform .22s ease;overflow-y:auto;padding:22px 24px 40px}
.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.drawer .dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:16px}
.drawer .dh h2{font-size:19px;text-transform:none;font-family:var(--body);font-weight:600}
.drawer .sub{color:var(--ink2);font-size:13px}
.drawer .sub a{cursor:pointer}
.section{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.section h3{margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:14px}
.kv .k{color:var(--ink2)}
.stages{display:flex;gap:4px;margin:8px 0 4px}
.stages button{all:unset;cursor:pointer;flex:1;text-align:center;font-size:11px;padding:7px 4px;background:var(--panel);border-radius:4px;color:var(--ink2)}
.stages button:hover{color:var(--ink)}
.stages button[aria-current]{background:var(--magenta);color:#fff}
.act{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.act .t{color:var(--ink3);font-size:12px;white-space:nowrap;min-width:72px}
.act .tp{font-weight:600;margin-right:6px}
.act .by{color:var(--ink3);font-size:12px;margin-left:6px}
.env{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.env .s{font-size:12px;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--black);color:#fff;padding:9px 16px;border-radius:6px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
.toast.show{opacity:1}
.toast.err{background:var(--lost)}
@media (prefers-color-scheme:dark){.toast{background:#fff;color:#000}.toast.err{background:var(--lost);color:#fff}}
.hide{display:none!important}
.maptable td,.maptable th{padding:6px 8px;font-size:13px}
.maptable select{padding:4px 6px;font-size:13px}
.preview{font-size:12px;color:var(--ink2);max-width:100%;overflow:auto;white-space:nowrap}

.steps .step{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.steps .step .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600}
.steps .step .sh .btn{padding:3px 8px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 10px}
.chips button{all:unset;cursor:pointer;font-size:11px;padding:2px 7px;border:1px solid var(--line);border-radius:999px;color:var(--ink2)}
.chips button:hover{border-color:var(--magenta);color:var(--magenta)}
.mail{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.mail .mh{display:flex;justify-content:space-between;gap:8px}
.mail .mh .dir{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--panel);color:var(--ink2)}
.mail .mh .dir.in{color:var(--magenta)}
.mail .mb{font-size:13px;color:var(--ink2);margin-top:3px;white-space:pre-wrap;max-height:4.5em;overflow:hidden}
.mail .opened{color:var(--won);font-size:12px}
.enr{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.enr .s{font-size:12px;color:var(--ink2)}
.items td{padding:6px 8px;font-size:13px;vertical-align:middle}
.items th{padding:6px 8px}
.items input,.items select{padding:4px 6px;font-size:13px}
.items .num{text-align:right}
.items .tot td{border-bottom:0;font-weight:600}
.items .tot.grand td{background:var(--magenta);color:#fff}
.items .x{all:unset;cursor:pointer;color:var(--ink3);padding:0 4px}
.items .x:hover{color:var(--lost)}
.quote{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.quote .s{font-size:12px;color:var(--ink2)}
.stage-row{display:grid;grid-template-columns:1fr 70px 50px 50px 28px;gap:6px;align-items:center;margin-bottom:6px;font-size:13px}
.stage-row input[type=number]{padding:4px 6px}
.stage-row .x{all:unset;cursor:pointer;color:var(--ink3);text-align:center}
.stage-row .x:hover{color:var(--lost)}
.wfa{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.wfa .wh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:600;font-size:13px}
.snippet{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre-wrap;word-break:break-all}
.visit{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.visit .u{color:var(--ink2);font-size:12px;word-break:break-all}
.dash{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.widget{min-width:0;border-top:2px solid var(--line);padding-top:10px}
.widget.s2{grid-column:span 2}.widget.s3{grid-column:span 3}
.widget h3{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:6px}
.widget h3 .sub{font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink3);font-size:12px}
.widget .wtools{display:flex;gap:2px}
.widget .wtools button{all:unset;cursor:pointer;color:var(--ink3);padding:0 4px;font-size:12px}
.widget .wtools button:hover{color:var(--magenta)}
.widget table td,.widget table th{padding:5px 8px;font-size:13px}
.widget .kpis{margin-bottom:0}
.fc table{font-size:13px}
.fc td,.fc th{padding:6px 8px;white-space:nowrap}
.fc td.num,.fc th.num{text-align:right}
.fc tr.team td{font-weight:600;background:var(--panel)}
.fc input{width:90px;padding:3px 6px;text-align:right;font-size:13px}
.fc .gap{color:var(--lost)} .fc .ok{color:var(--won)}
.fc .mini{font-size:11px;color:var(--ink3)}
.seg.sm button{padding:4px 9px;font-size:12px}
@media (max-width:820px){.dash{grid-template-columns:1fr}.widget.s2,.widget.s3{grid-column:span 1}}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}
.authbox{width:min(400px,100%)}
.authbox .brand{margin-bottom:28px}
.authbox h1{font-size:20px;margin-bottom:18px}
.err{color:var(--lost);font-size:13px;margin:-4px 0 10px;min-height:1em}

/* ---- mobile / installed app ---- */
.tabbar{display:none}
@media (max-width:820px){
  html{-webkit-text-size-adjust:100%}
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  input,select,textarea{font-size:16px}
  .btn{min-height:40px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:19;background:var(--bg);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--ink2);padding:4px 0}
  .tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tabbar button[aria-current]{color:var(--magenta)}
  .tabbar button .b{position:absolute;margin-left:22px;margin-top:-2px;background:var(--magenta);color:#fff;font-size:9px;font-weight:600;border-radius:999px;padding:1px 5px;line-height:1.3}
  .rail .nav{display:none}
  .rail{padding-top:calc(10px + env(safe-area-inset-top))}
  .drawer{width:100vw;padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
  .top h1{font-size:19px}
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);background:var(--bg);z-index:10;gap:10px;overflow-x:auto}
  .brand small{display:none}
  .nav{flex-direction:row}
  .nav button{padding:7px 10px;font-size:14px;white-space:nowrap}
  .nav button .n{display:none}
  .rail .foot{display:none}
  main{padding:16px 14px 60px}
  .board{grid-template-columns:repeat(5,82vw)}
  .panels{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .bar,.fstep{grid-template-columns:110px 1fr 56px}
  .kv{grid-template-columns:100px 1fr}
}
</style>
</head>
<body>
<div id="root"></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="toast" id="toast"></div>

<script>
/* ---------- constants ---------- */
let STAGES = ['New lead','Contacted','Qualified','Proposal sent','Closed won'];
let SIGN_STAGES = ['Proposal sent','Closed won'];
let curPipeline = null;
const VERTICALS = ['Debt consolidation','Personal lending','Mortgage','Automotive','Powersports','RV / Marine','eCommerce','Other'];
const SOURCES = ['Website','Referral','Outbound','Partner','Event','Inbound email','Import','Other'];
const SIZES = ['1–10','11–50','51–200','201–500','501–1,000','1,000+'];
const ACT_TYPES = ['Note','Call','Email','Meeting','Proposal'];

/* ---------- state ---------- */
let me = null;
let db = { contacts:[], companies:[], deals:[], tasks:[], envelopes:[], users:[], sequences:[], enrollments:[], properties:[], pipelines:[], products:[], forms:[], workflows:[], meetings:[], dashboards:[] };
let WIDGET_TYPES={}; let curDash=null, dashRange=null, dashEdit=false; let fcMonths=6;
let SITE_KEY='';
let integrations = { docusign:false, email:false, inbound:false, calendar:false };
let MERGE_TAGS = [];
let view = 'pipeline';
let search = '';
let mineOnly = false;
let taskFilter = 'mine';

const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const fmtMoney = n => '$' + (Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:0});
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';
const fmtDay = ymd => ymd ? new Date(ymd+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId = (arr,id) => arr.find(x=>String(x.id)===String(id));
const companyName = id => (byId(db.companies,id)||{}).name || '';
const userName = id => (byId(db.users,id)||{}).name || '';
const fullName = c => c ? ([c.first,c.last].filter(Boolean).join(' ') || '(no name)') : '';
const contactName = id => fullName(byId(db.contacts,id));

const stageNames = pipe => (pipe?.stages||[]).map(st=>st.name);

const dealsOf = {

const sum = arr => arr.reduce((a,d)=>a+(Number(d.value)||0),0);

/* ---------- api ---------- */
async function api(path, opts={}){
  const r = await fetch(path, { headers:{'Content-Type':'application/json'}, credentials:'same-origin', ...opts, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if(r.status===401 && me){ me=null; renderAuth(); throw new Error('Signed out'); }
  const data = await r.json().catch(()=>({}));
  if(!r.ok){ throw new Error(data.error || 'Request failed'); }
  return data;
}

  render();
}

let toastTimer;
function toast(msg, isErr){

}

/* ---------- hash routing (email deep links) ---------- */
function routeFromHash(){
  const h = location.hash.replace(/^#/,'');
  if(!h) return;
  const [kind, id] = h.split('/');
  if(['pipeline','contacts','companies','tasks','sequences','forms','workflows','analytics','forecast','team','settings'].includes(kind)){ view=kind; render(); }
  else if(kind==='deal' && id){ view='pipeline'; render(); openDetail('deal', id); }
  else if(kind==='contact' && id){ view='contacts'; render(); openDetail('contact', id); }
  history.replaceState(null,'',location.pathname);
}
window.addEventListener('hashchange', ()=>{ if(me) routeFromHash(); });

/* ---------- pipeline (deals) ---------- */
function sigBadge(d){
  const envs = envsOf(d.id); if(!envs.length) return '';
  const latest = envs[0];
  if(latest.status==='completed') return `<span class="sig done">Signed</span>`;
  if(['declined','voided'].includes(latest.status)) return `<span class="sig" style="color:var(--lost)">${latest.status}</span>`;
  return `<span class="sig">Awaiting signature</span>`;
}
function renderPipeline(){
  const pipe = byId(db.pipelines,curPipeline) || defaultPipe();
  const visible = db.deals.filter(d=>String(d.pipelineId)===String(pipe.id) && (!mineOnly || String(d.ownerId)===String(me.id)));
  const openDeals = visible.filter(dealOpen);
  const cols = (pipe.stages||[]).map(st=>{
    const s = st.name;
    const cards = visible.filter(d=>d.stage===s && !d.lost);
    return `<section class="col" data-stage="${esc(s)}">
      <div class="colhead"><h3>${esc(s)}</h3><span class="sum" title="${st.probability}% probability">${cards.length} · ${fmtMoney(sum(cards))}${st.won?'':` · <b>${fmtMoney(sum(cards)*st.probability/100)}</b>`}</span></div>
      ${cards.length ? cards.map(d=>`<article class="card" draggable="true" tabindex="0" data-id="${d.id}">
        <div class="nm">${esc(d.name)}</div>
        <div class="co">${esc([contactName(d.contactId), companyName(d.companyId)].filter(Boolean).join(' · '))}</div>
        <div class="meta"><span>${esc(userName(d.ownerId)||d.vertical||'')}</span>${sigBadge(d)}<span class="val">${d.value?fmtMoney(d.value):''}</span></div>
      </article>`).join('') : `<div class="empty">Drop a deal here</div>`}
    </section>`;
  }).join('');
  return `<div class="top"><h1>Pipeline</h1><div class="actions">
      ${db.pipelines.length>1?`<select id="pipe-sel" style="width:auto">${pipeOpts(pipe.id)}</select>`:''}
      <span class="note">Open ${fmtMoney(sum(openDeals))} · weighted <b>${fmtMoney(weighted(openDeals))}</b></span>
      <div class="seg"><button aria-pressed="${!mineOnly}" data-mine="0">All</button><button aria-pressed="${mineOnly}" data-mine="1">Mine</button></div>
      <button class="btn primary" data-new="deal">Add deal</button></div></div>
    <div class="board" style="grid-template-columns:repeat(${(pipe.stages||[]).length},minmax(220px,1fr))">${cols}</div>
    ${db.deals.length ? '' : `<div class="bigempty" style="margin-top:12px"><p>No deals yet. Add one, or add a contact and tick "also create a deal".</p><button class="btn primary" data-new="deal">Add deal</button></div>`}`;
}
function stageTag(d){
  if(d.lost) return `<span class="tag lost">Lost</span>`;
  if(isWon(d)) return `<span class="tag won">${esc(d.stage)}</span>`;
  return `<span class="tag stage">${esc(d.stage)}</span>`;
}
function contactStatus(c){
  const ds = dealsOf.contact(c.id);
  if(!ds.length) return `<span class="tag">No deal</span>`;
  const open = ds.filter(dealOpen);
  if(open.length) return open.length===1 ? stageTag(open[0]) : `<span class="tag stage">${open.length} open deals</span>`;
  if(ds.some(isWon)) return `<span class="tag won">Won</span>`;
  return `<span class="tag lost">Lost</span>`;
}

/* ---------- tasks ---------- */
function taskRow(t, showLinks=true){
  const d = t.dealId ? byId(db.deals,t.dealId) : null, c = t.contactId ? byId(db.contacts,t.contactId) : null;
  const dueCls = !t.done && t.dueAt ? (t.dueAt<today()?'over':t.dueAt===today()?'today':'') : '';
  return `<div class="task ${t.done?'done':''}" data-task="${t.id}">
    <input type="checkbox" ${t.done?'checked':''} data-done="${t.id}" aria-label="Done">
    <div><div class="t">${esc(t.title)}</div>
      <div class="sub">${t.dueAt?`<span class="due ${dueCls}">${t.dueAt<today()&&!t.done?'Overdue · ':''}${fmtDay(t.dueAt)}</span> · `:''}${esc(userName(t.assigneeId)||'Unassigned')}${showLinks&&d?` · <a data-open-deal="${d.id}">${esc(d.name)}</a>`:''}${showLinks&&c&&!d?` · <a data-open-contact="${c.id}">${esc(fullName(c))}</a>`:''}</div></div>
    <button class="x" data-del-task="${t.id}" title="Delete">✕</button>
  </div>`;
}
function renderTasks(){
  const mine = taskFilter==='mine';
  const all = db.tasks.filter(t=>!mine || String(t.assigneeId)===String(me.id));
  const open = all.filter(t=>!t.done), done = all.filter(t=>t.done).slice(0,30);
  const groups = [
    ['Overdue', open.filter(t=>t.dueAt && t.dueAt<today())],
    ['Today', open.filter(t=>t.dueAt===today())],
    ['Upcoming', open.filter(t=>t.dueAt && t.dueAt>today()).sort((a,b)=>a.dueAt.localeCompare(b.dueAt))],
    ['No date', open.filter(t=>!t.dueAt)],
  ].filter(g=>g[1].length);
  return `<div class="top"><h1>Tasks</h1><div class="actions">
    <div class="seg"><button aria-pressed="${mine}" data-tf="mine">Mine</button><button aria-pressed="${!mine}" data-tf="all">Everyone</button></div>
    <button class="btn primary" data-new="task">Add task</button></div></div>
  <div class="tasklist">
    ${groups.length ? groups.map(([h,ts])=>`<h3>${h} (${ts.length})</h3>${ts.map(t=>taskRow(t)).join('')}`).join('') : `<div class="bigempty"><p>Nothing open${mine?' for you':''}.</p><button class="btn primary" data-new="task">Add task</button></div>`}
    ${done.length?`<h3>Done recently</h3>${done.map(t=>taskRow(t)).join('')}`:''}
  </div>`;
}

function renderSequences(){
  const rows = db.sequences;

function bindChips(scope){

    <div class="row"><button class="btn primary" id="em-send" ${integrations.email?'':'disabled'}>Send</button><button class="btn" id="em-preview">Preview</button><button class="btn ghost" data-close>Cancel</button></div>

    ${db.workflows.map(w=>`<tr class="rowlink" data-open="workflow" data-id="${w.id}"><td><strong>${esc(w.name)}</strong></td><td>${esc(TRIG_LABEL[w.trigger]||w.trigger)}${w.conditions.stage?` → ${esc(w.conditions.stage)}`:''}${w.conditions.days?` (${w.conditions.days} days)`:''}</td><td class="muted" style="font-size:13px">${w.actions.map(a=>esc(ACT_LABEL[a.type]||a.type)).join(', ')}</td><td>${w.runs}${w.lastRunAt?` <span class="muted" style="font-size:12px">last ${fmtDate(w.lastRunAt)}</span>`:''}</td><td>${w.active?'<span class="tag won">On</span>':'<span class="tag">Off</span>'}</td></tr>`).join('')}
  </tbody></table>` : `<div class="bigempty"><p>No workflows yet. Examples: deal hits Proposal sent → create a 3-day follow-up task · no activity for 14 days → email the owner · Closed won → assign onboarding tasks · form submitted → enroll in intro sequence.</p><button class="btn primary" data-new="workflow">New workflow</button></div>`}`;
}
function openWorkflowEditor(id){
  const w = id ? byId(db.workflows,id) : { name:'', trigger:'deal_stage', conditions:{}, actions:[{type:'create_task',title:'Follow up with {{name}}',dueDays:3,assignee:'owner'}], active:true };
  const c = w.conditions||{};
  const actionHtml = (a,i) => `<div class="wfa" data-act><div class="wh"><select class="wa-type" style="width:auto">${Object.entries(ACT_LABEL).map(([k,l])=>`<option value="${k}" ${a.type===k?'selected':''}>${esc(l)}</option>`).join('')}</select><button class="x wa-del" type="button" style="all:unset;cursor:pointer;color:var(--ink3)">✕</button></div>
    <div class="wa-body">${actionBody(a)}</div></div>`;
  function actionBody(a){
    switch(a.type){
      case 'create_task': return `<div class="grid2"><div class="field"><label>Task title ({{name}} = deal/contact)</label><input class="wa-title" value="${esc(a.title||'Follow up with {{name}}')}"></div><div class="field"><label>Due in (days)</label><input class="wa-due" type="number" min="0" value="${esc(a.dueDays??3)}"></div><div class="field"><label>Assign to</label><select class="wa-assignee"><option value="owner" ${!a.assignee||a.assignee==='owner'?'selected':''}>Deal / contact owner</option>${ownerOpts(a.assignee)}</select></div></div>`;
      case 'notify_owner': return `<div class="field"><label>Subject</label><input class="wa-subject" value="${esc(a.subject||'')}" placeholder="Default: workflow name + deal"></div><div class="field"><label>Message</label><textarea class="wa-message" style="min-height:60px">${esc(a.message||'')}</textarea></div>`;
      case 'email_contact': return `<div class="field"><label>Subject</label><input class="wa-subject" value="${esc(a.subject||'')}"></div><div class="field"><label>Body (merge tags work)</label><textarea class="wa-ebody" style="min-height:100px">${esc(a.body||'')}</textarea>${mergeChips('.wa-ebody')}</div><p class="note">Sent from the owner's name via connect@, tracked like any CRM email.</p>`;
      case 'enroll_sequence': return `<div class="field"><label>Sequence</label><select class="wa-seq">${db.sequences.filter(x=>x.active).map(x=>`<option value="${x.id}" ${String(x.id)===String(a.sequenceId)?'selected':''}>${esc(x.name)}</option>`).join('')||'<option value="">No active sequences</option>'}</select></div>`;
      case 'set_owner': return `<div class="field"><label>New owner</label><select class="wa-user">${ownerOpts(a.userId||me.id)}</select></div>`;
      case 'set_stage': return `<div class="field"><label>Move deal to</label><select class="wa-stage">${[...new Set(db.pipelines.flatMap(stageNames))].map(st=>`<option ${a.stage===st?'selected':''}>${esc(st)}</option>`).join('')}</select></div>`;
      case 'add_note': return `<div class="field"><label>Note</label><input class="wa-text" value="${esc(a.text||'')}"></div>`;
      case 'push_to_launchpad': return `<div class="field"><label>Weekly cycles for SMS / email</label><select class="wa-recurring"><option value="yes" ${a.recurring!=='no'?'selected':''}>Yes — set SMS & email campaigns to repeat every 7 days</option><option value="no" ${a.recurring==='no'?'selected':''}>No — one-time launches</option></select></div><p class="note">Creates the client in Launchpad with its onboarding checklist and one campaign per channel found in the deal's line items. Re-running updates the same client.${integrations.launchpad?'':' <b>Launchpad isn\'t connected</b> — an admin sets LAUNCHPAD_URL / LAUNCHPAD_SECRET.'}</p>`;
    }
    return '';
  }
  const condHtml = trig => {
    const stageOpts = [...new Set(db.pipelines.flatMap(stageNames))];
    const common = `<div class="field"><label>Vertical (optional)</label><select id="wc-vertical"><option value="">Any</option>${opts(VERTICALS,c.vertical)}</select></div><div class="field"><label>Source (optional)</label><select id="wc-source"><option value="">Any</option>${opts(SOURCES,c.source)}</select></div><div class="field"><label>Owner (optional)</label><select id="wc-owner"><option value="">Any</option>${ownerOpts(c.ownerId)}</select></div>`;
    if(trig==='deal_stage') return `<div class="grid2"><div class="field"><label>Pipeline (optional)</label><select id="wc-pipeline"><option value="">Any</option>${pipeOpts(c.pipelineId)}</select></div><div class="field"><label>Moved to stage</label><select id="wc-stage"><option value="">Any stage</option>${stageOpts.map(st=>`<option ${c.stage===st?'selected':''}>${esc(st)}</option>`).join('')}</select></div>${common}</div>`;
    if(trig==='no_activity') return `<div class="grid2"><div class="field"><label>Days without activity</label><input id="wc-days" type="number" min="1" value="${esc(c.days||14)}"></div><div class="field"><label>Pipeline (optional)</label><select id="wc-pipeline"><option value="">Any</option>${pipeOpts(c.pipelineId)}</select></div><div class="field"><label>In stage (optional)</label><select id="wc-stage"><option value="">Any stage</option>${stageOpts.map(st=>`<option ${c.stage===st?'selected':''}>${esc(st)}</option>`).join('')}</select></div>${common}</div><p class="note">Runs hourly; fires at most once per deal per N days.</p>`;
    if(trig==='form_submitted') return `<div class="grid2"><div class="field"><label>Form</label><select id="wc-form"><option value="">Any form</option>${db.forms.map(f=>`<option value="${f.id}" ${String(f.id)===String(c.formId)?'selected':''}>${esc(f.name)}</option>`).join('')}</select></div>${common}</div>`;
    if(trig==='deal_created'||trig==='deal_won'||trig==='deal_lost') return `<div class="grid2"><div class="field"><label>Pipeline (optional)</label><select id="wc-pipeline"><option value="">Any</option>${pipeOpts(c.pipelineId)}</select></div><div class="field"><label>Minimum value (optional)</label><input id="wc-min" type="number" min="0" value="${esc(c.minValue||'')}"></div>${common}</div>`;
    return `<div class="grid2">${common}</div>`;
  };
  openDrawer(`${dhead(id?'Edit workflow':'New workflow', id?`${w.runs} runs`:'')}
    <div class="grid2"><div class="field"><label>Name</label><input id="wf-name" value="${esc(w.name)}" placeholder="Proposal follow-up"></div><div class="field"><label>Status</label><select id="wf-active"><option value="1" ${w.active?'selected':''}>On</option><option value="0" ${!w.active?'selected':''}>Off</option></select></div></div>
    <h3 style="margin:12px 0 8px">When</h3>
    <div class="field"><select id="wf-trigger">${Object.entries(TRIG_LABEL).map(([k,l])=>`<option value="${k}" ${w.trigger===k?'selected':''}>${esc(l)}</option>`).join('')}</select></div>
    <div id="wf-cond">${condHtml(w.trigger)}</div>
    <h3 style="margin:12px 0 8px">Then</h3>
    <div id="wf-actions">${w.actions.map(actionHtml).join('')}</div>
    <div class="row"><button class="btn sm" id="wf-add" type="button">Add action</button></div>
    ${id?`<div class="section"><h3>Recent runs</h3><div id="wf-runs"><div class="empty">Loading…</div></div></div>`:''}
    <div class="row" style="margin-top:16px"><button class="btn primary" id="wf-save">${id?'Save workflow':'Create workflow'}</button>${id?`<button class="btn ghost danger" id="wf-del">Delete</button>`:''}</div>`);
  const acts = drawer.querySelector('#wf-actions');
  const bind = ()=>{ acts.querySelectorAll('[data-act]').forEach(el=>{ el.querySelector('.wa-del').onclick=()=>el.remove(); el.querySelector('.wa-type').onchange=e=>{ el.querySelector('.wa-body').innerHTML = actionBody({type:e.target.value}); bindChips(el); }; }); bindChips(acts); };
  bind();
  drawer.querySelector('#wf-add').onclick = ()=>{ acts.insertAdjacentHTML('beforeend', actionHtml({type:'notify_owner'},99)); bind(); };
  drawer.querySelector('#wf-trigger').onchange = e=>{ drawer.querySelector('#wf-cond').innerHTML = condHtml(e.target.value); };
  drawer.querySelector('#wf-save').onclick = async ()=>{
    const g = sel=>{ const el=drawer.querySelector(sel); return el?el.value.trim():''; };
    const conditions = { pipelineId:g('#wc-pipeline'), stage:g('#wc-stage'), vertical:g('#wc-vertical'), source:g('#wc-source'), ownerId:g('#wc-owner'), formId:g('#wc-form'), days:g('#wc-days'), minValue:g('#wc-min') };
    const actions = [...acts.querySelectorAll('[data-act]')].map(el=>{ const v=cls=>{ const x=el.querySelector(cls); return x?x.value.trim():''; }; return { type:el.querySelector('.wa-type').value, title:v('.wa-title'), dueDays:v('.wa-due'), assignee:v('.wa-assignee'), subject:v('.wa-subject'), message:v('.wa-message'), body:v('.wa-ebody'), sequenceId:v('.wa-seq'), userId:v('.wa-user'), stage:v('.wa-stage'), text:v('.wa-text'), recurring:v('.wa-recurring') }; });
    if(!dv('#wf-name')||!actions.length){ toast('Name and at least one action', true); return; }
    await tryApi(()=>api(id?`/api/workflows/${id}`:'/api/workflows',{method:id?'PUT':'POST',body:{name:dv('#wf-name'),active:dv('#wf-active')==='1',trigger:dv('#wf-trigger'),conditions,actions}}));
    await refresh(); closeDrawer(); toast(id?'Workflow saved':'Workflow created');
  };
  const del = drawer.querySelector('#wf-del'); if(del) del.onclick = async ()=>{ if(!confirm(`Delete "${w.name}"?`)) return; await tryApi(()=>api(`/api/workflows/${id}`,{method:'DELETE'})); await refresh(); closeDrawer(); toast('Deleted'); };
  if(id){ api(`/api/workflows/${id}/runs`).then(runs=>{ const el=drawer.querySelector('#wf-runs'); if(!el) return; el.innerHTML = runs.length ? runs.slice(0,20).map(r=>`<div class="act"><span class="t">${fmtDate(r.at)}</span><span>${r.dealId?`<a data-open-deal="${r.dealId}" style="cursor:pointer;text-decoration:underline">${esc(r.dealName||'deal')}</a>`:r.contactId?`<a data-open-contact="${r.contactId}" style="cursor:pointer;text-decoration:underline">${esc(r.contactName||'contact')}</a>`:''} <span class="muted">— ${esc(r.summary||'no actions applied')}</span></span></div>`).join('') : '<div class="empty">Hasn\'t run yet</div>'; el.querySelectorAll('[data-open-deal]').forEach(a=>a.onclick=()=>openDetail('deal',a.dataset.openDeal)); el.querySelectorAll('[data-open-contact]').forEach(a=>a.onclick=()=>openDetail('contact',a.dataset.openContact)); }).catch(()=>{}); }
}

const RANGE_LABELS = { '7d':'7 days','30d':'30 days','90d':'90 days','mtd':'MTD','qtd':'QTD','ytd':'YTD' };
function renderDashboards(){
  const dash = byId(db.dashboards,curDash) || db.dashboards[0];

  <div class="dash" id="dash">${dash.widgets.map(w=>`<div class="widget s${w.size||1}"><h3>${esc(w.title||WIDGET_TYPES[w.type]||w.type)}</h3><div class="empty">Loading…</div></div>`).join('')||'<div class="bigempty" style="grid-column:span 3"><p>Empty dashboard — click Edit, then add widgets.</p></div>'}</div>`;
}
async function loadDashboard(dash, range){
  const el = document.getElementById('dash'); if(!el) return;
  let data; try{ data = await api(`/api/dashboards/${dash.id}/data?range=${encodeURIComponent(range)}`); }catch(e){ el.innerHTML=`<div class="warnbox" style="grid-column:span 3">${esc(e.message)}</div>`; return; }
  if(document.getElementById('dash')!==el) return;
  el.innerHTML = data.widgets.map((w,i)=>`<div class="widget s${w.size||1}" data-wi="${i}"><h3><span>${esc(w.title)}${w.data.subtitle?` <span class="sub">${esc(w.data.subtitle)}</span>`:''}</span>${dashEdit?`<span class="wtools"><button data-wmove="-1" title="Move left">◀</button><button data-wmove="1" title="Move right">▶</button><button data-wsize title="Resize">⤢ ${w.size||1}</button><button data-wdel title="Remove">✕</button></span>`:''}</h3>${renderWidget(w.data)}</div>`).join('') || '<div class="bigempty" style="grid-column:span 3"><p>Empty dashboard — click Edit, then add widgets.</p></div>';
  const save = async widgets => { await tryApi(()=>api(`/api/dashboards/${dash.id}`,{method:'PUT',body:{widgets}})); await refresh(); };
  el.querySelectorAll('[data-wdel]').forEach(b=>b.onclick=()=>{ const i=Number(b.closest('[data-wi]').dataset.wi); save(dash.widgets.filter((_,j)=>j!==i)); });
  el.querySelectorAll('[data-wsize]').forEach(b=>b.onclick=()=>{ const i=Number(b.closest('[data-wi]').dataset.wi); const ws=dash.widgets.map((w,j)=>j===i?{...w,size:((w.size||1)%3)+1}:w); save(ws); });
  el.querySelectorAll('[data-wmove]').forEach(b=>b.onclick=()=>{ const i=Number(b.closest('[data-wi]').dataset.wi), j=i+Number(b.dataset.wmove); if(j<0||j>=dash.widgets.length) return; const ws=dash.widgets.slice(); [ws[i],ws[j]]=[ws[j],ws[i]]; save(ws); });
  el.querySelectorAll('[data-open-deal]').forEach(a=>a.onclick=()=>openDetail('deal',a.dataset.openDeal));
}
function renderWidget(d){
  if(d.kpis) return `<div class="kpis">${d.kpis.map(k=>`<div class="kpi ${k.accent?'accent':''}"><div class="v">${k.money?fmtMoney(k.value):esc(k.value)}</div><div class="l">${esc(k.label)}</div></div>`).join('')}</div>`;
  if(d.bars){ const max=Math.max(1,...d.bars.map(b=>b.value)); return d.bars.length?`<div class="bars">${d.bars.map(b=>`<div class="bar"><span title="${esc(b.label)}">${esc(b.label)}</span><div class="track"><div class="fill ${b.money?'m':''}" style="width:${b.value/max*100}%"></div></div><span class="n">${b.money?fmtMoney(b.value):b.value}</span></div>`).join('')}</div>`:'<div class="empty">No data in range</div>'; }
  if(d.table) return d.table.rows.length?`<table><thead><tr>${d.table.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${d.table.rows.map(r=>`<tr>${r.map((c,i)=>`<td ${i?'':'style="font-weight:500"'}>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<div class="empty">No data in range</div>';
  if(d.funnel){ const max=Math.max(1,...d.funnel.map(f=>f.value)); return d.funnel.map(f=>`<div class="fstep"><span>${esc(f.label)}</span><div class="f" style="width:${f.value/max*100}%"></div><span class="pct">${f.value}${f.pct!=null?` · ${f.pct}%`:''}</span></div>`).join(''); }
  if(d.series){ const W=600,H=170,pad=22,n=d.series.labels.length,max=Math.max(1,...d.series.lines.flatMap(l=>l.values)); const x=i=>pad+i*((W-pad*2)/Math.max(1,n-1)); const y=v=>H-pad-v/max*(H-pad*2);
    const paths=d.series.lines.map(l=>`<path d="${l.values.map((v,i)=>`${i?'L':'M'}${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="${l.accent?'var(--magenta)':'var(--ink)'}" stroke-width="2"/>`).join('');
    const ticks=[0,Math.floor(n/2),n-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>`<text x="${x(i)}" y="${H-4}" font-size="10" fill="var(--ink3)" text-anchor="middle">${esc(d.series.labels[i]||'')}</text>`).join('');
    return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${paths}${ticks}<text x="${pad}" y="12" font-size="10" fill="var(--ink3)">max ${max}</text></svg></div><div class="row" style="gap:14px;font-size:12px;color:var(--ink2)">${d.series.lines.map(l=>`<span><span style="display:inline-block;width:10px;height:3px;background:${l.accent?'var(--magenta)':'var(--ink)'};vertical-align:middle;margin-right:4px"></span>${esc(l.name)} (${l.values.reduce((a,b)=>a+b,0)})</span>`).join('')}</div>`; }
  return '<div class="empty">—</div>';
}

let fcData=null;
function renderForecast(){
  setTimeout(loadForecast, 0);
  return `<div class="top"><h1>Forecast</h1><div class="actions"><div class="seg sm">${[3,6,12].map(n=>`<button aria-pressed="${fcMonths===n}" data-fcm="${n}">${n} mo</button>`).join('')}</div>${me.role==='admin'?'<button class="btn sm" id="fc-quotas">Edit quotas</button>':''}</div></div><div id="fc" class="muted">Loading…</div>`;

async function loadForecast(){
  const el = document.getElementById('fc'); if(!el) return;
  try{ fcData = await api(`/api/forecast?months=${fcMonths}`); }catch(e){ el.innerHTML=`<div class="warnbox">${esc(e.message)}</div>`; return; }
  const F = fcData, M = F.months;
  const cellHtml = c => `<td class="num"><div><b>${fmtMoney(c.forecast)}</b>${c.quota?`<span class="mini"> / ${fmtMoney(c.quota)}</span>`:''}</div><div class="mini">won ${fmtMoney(c.won)} · commit ${fmtMoney(c.commit)}</div><div class="mini">best ${fmtMoney(c.best)} · pipe ${fmtMoney(c.pipeline)} · wtd ${fmtMoney(c.weighted)}</div>${c.quota?`<div class="mini ${c.gap?'gap':'ok'}">${c.gap?`gap ${fmtMoney(c.gap)}`:'quota met'}${c.bestCase>=c.quota&&c.gap?' · reachable best case':''}</div>`:''}</td>`;
  el.innerHTML = `<p class="note">Forecast = closed won + commit. Deals land in the month of their expected close date; category comes from stage probability (≥75% commit, ≥50% best case) unless set on the deal.</p>
  <div class="fc" style="overflow:auto"><table><thead><tr><th>Rep</th>${M.map(m=>`<th class="num">${esc(m.label)}</th>`).join('')}</tr></thead><tbody>
    ${F.reps.map(r=>`<tr><td><b>${esc(r.name)}</b></td>${r.months.map(cellHtml).join('')}</tr>`).join('')}
    <tr class="team"><td>Team</td>${F.team.months.map(cellHtml).join('')}</tr>
  </tbody></table></div>
  <div class="panels" style="margin-top:22px">
    <div class="panel"><h3>Deals by expected close</h3>${M.map(m=>{ const ds=F.dealsByMonth[m.ym]||[]; if(!ds.length) return ''; return `<h3 style="margin-top:10px;color:var(--ink)">${esc(m.label)} <span class="muted" style="font-weight:400;text-transform:none;letter-spacing:0">(${ds.length} · ${fmtMoney(ds.reduce((a,d)=>a+d.value,0))})</span></h3>${ds.sort((a,b)=>b.value-a.value).map(d=>`<div class="act" style="cursor:pointer" data-open-deal="${d.id}"><span style="flex:1"><b>${esc(d.name)}</b> <span class="muted">${esc(d.stage)} · ${esc(userName(d.ownerId))}</span></span><span class="tag ${d.cat==='commit'?'won':d.cat==='best'?'m':''}">${d.cat}</span><span style="min-width:80px;text-align:right">${fmtMoney(d.value)}</span></div>`).join('')}`; }).join('')||'<div class="empty">No open deals with expected close dates in this window</div>'}</div>
    <div class="panel"><h3>Open deals with no close date (${F.noClose.length})</h3>${F.noClose.length?F.noClose.sort((a,b)=>b.value-a.value).map(d=>`<div class="act" style="cursor:pointer" data-open-deal="${d.id}"><span style="flex:1"><b>${esc(d.name)}</b> <span class="muted">${esc(d.stage)} · ${esc(userName(d.ownerId))}</span></span><span style="min-width:80px;text-align:right">${fmtMoney(d.value)}</span></div>`).join('')+'<p class="note" style="margin-top:8px">These are excluded from the monthly forecast — set an expected close on each deal.</p>':'<div class="empty">Every open deal has a close date</div>'}</div>
  </div>`;
  el.querySelectorAll('[data-open-deal]').forEach(a=>a.onclick=()=>openDetail('deal',a.dataset.openDeal));
}
function openQuotas(){
  const F = fcData; if(!F) return;
  const users = db.users.filter(u=>u.active);
  openDrawer(`${dhead('Monthly quotas', 'Closed-won revenue target per rep')}
    <div class="fc" style="overflow:auto"><table><thead><tr><th>Rep</th>${F.months.map(m=>`<th class="num">${esc(m.label)}</th>`).join('')}</tr></thead><tbody>
    ${users.map(u=>`<tr><td>${esc(u.name)}</td>${F.months.map(m=>{ const qv=(F.quotas.find(x=>x.userId===u.id&&x.period===m.ym)||{}).amount||''; return `<td class="num"><input type="number" min="0" step="1000" data-q-user="${u.id}" data-q-period="${m.ym}" value="${qv}"></td>`; }).join('')}</tr>`).join('')}
    </tbody></table></div>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="q-save">Save quotas</button><button class="btn sm" id="q-fill">Copy first month across</button></div>`);
  drawer.querySelector('#q-fill').onclick = ()=>{ users.forEach(u=>{ const inputs=[...drawer.querySelectorAll(`[data-q-user="${u.id}"]`)]; const v=inputs[0].value; inputs.forEach(i=>i.value=v); }); };
  drawer.querySelector('#q-save').onclick = async ()=>{ const quotas=[...drawer.querySelectorAll('[data-q-user]')].map(i=>({userId:Number(i.dataset.qUser),period:i.dataset.qPeriod,amount:i.value||0})); await tryApi(()=>api('/api/quotas',{method:'PUT',body:{quotas}})); closeDrawer(); toast('Quotas saved'); render(); };
}

/* ---------- main bindings ---------- */
function bindMain(){
  const m = document.getElementById('main');
  m.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>({sequence:()=>openSequenceForm(), form:()=>openFormEditor(), workflow:()=>openWorkflowEditor()}[b.dataset.new]||(()=>openForm(b.dataset.new)))());
  m.querySelectorAll('[data-open]').forEach(r=>r.onclick=()=>{ const k=r.dataset.open; if(k==='sequence') openSequenceForm(r.dataset.id); else if(k==='form') openFormEditor(r.dataset.id); else if(k==='workflow') openWorkflowEditor(r.dataset.id); else openDetail(k, r.dataset.id); });
  m.querySelectorAll('[data-mine]').forEach(b=>b.onclick=()=>{ mineOnly=b.dataset.mine==='1'; render(); });
  const ps = m.querySelector('#pipe-sel'); if(ps) ps.onchange = ()=>{ curPipeline = ps.value; render(); };
  const dsel = m.querySelector('#dash-sel'); if(dsel) dsel.onchange = ()=>{ curDash = Number(dsel.value); dashRange=null; render(); };
  m.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{ dashRange=b.dataset.range; render(); });
  const de = m.querySelector('#dash-edit'); if(de) de.onclick = ()=>{ dashEdit=!dashEdit; render(); };
  const dn = m.querySelector('#dash-new'); if(dn) dn.onclick = async ()=>{ const name=prompt('Dashboard name','New dashboard'); if(!name) return; const r=await tryApi(()=>api('/api/dashboards',{method:'POST',body:{name,widgets:[{type:'kpis',size:3}]}})); await refresh(); curDash=r.id; dashEdit=true; render(); };
  const da = m.querySelector('#dash-add'); if(da) da.onchange = async ()=>{ if(!da.value) return; const dash=byId(db.dashboards,curDash); await tryApi(()=>api(`/api/dashboards/${dash.id}`,{method:'PUT',body:{widgets:[...dash.widgets,{type:da.value,size:da.value==='kpis'?3:1}]}})); await refresh(); };
  const dr = m.querySelector('#dash-rename'); if(dr) dr.onclick = async ()=>{ const dash=byId(db.dashboards,curDash); const name=prompt('Rename dashboard',dash.name); if(!name) return; await tryApi(()=>api(`/api/dashboards/${dash.id}`,{method:'PUT',body:{name}})); await refresh(); };
  const dm = m.querySelector('#dash-mail'); if(dm) dm.onclick = ()=>openDashboardMail(byId(db.dashboards,curDash));
  const dsn = m.querySelector('#dash-send'); if(dsn) dsn.onclick = async ()=>{ await tryApi(()=>api(`/api/dashboards/${curDash}/email`,{method:'POST'})); toast('Sent to your inbox'); };
  const dd = m.querySelector('#dash-del'); if(dd) dd.onclick = async ()=>{ const dash=byId(db.dashboards,curDash); if(!confirm(`Delete "${dash.name}"?`)) return; await tryApi(()=>api(`/api/dashboards/${dash.id}`,{method:'DELETE'})); curDash=null; dashEdit=false; await refresh(); };
  m.querySelectorAll('[data-fcm]').forEach(b=>b.onclick=()=>{ fcMonths=Number(b.dataset.fcm); render(); });
  const fq = m.querySelector('#fc-quotas'); if(fq) fq.onclick = openQuotas;
  m.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>{ taskFilter=b.dataset.tf; render(); });
  m.querySelectorAll('[data-import]').forEach(b=>b.onclick=()=>openImport(b.dataset.import));
  bindTaskRows(m);
  bindEnrollStops(m, render);
  const s = m.querySelector('#search');
  if(s){ s.oninput = ()=>{ search=s.value; const pos=s.selectionStart; render(); const s2=document.getElementById('search'); s2.focus(); s2.setSelectionRange(pos,pos); }; }
  m.querySelectorAll('.card').forEach(c=>{
    c.onclick=()=>openDetail('deal', c.dataset.id);
    c.onkeydown=e=>{ if(e.key==='Enter') openDetail('deal', c.dataset.id); };
    c.ondragstart=e=>{ e.dataTransfer.setData('text/plain', c.dataset.id); c.classList.add('dragging'); };
    c.ondragend=()=>c.classList.remove('dragging');
  });
  m.querySelectorAll('.col').forEach(col=>{
    col.ondragover=e=>{ e.preventDefault(); col.classList.add('over'); };
    col.ondragleave=()=>col.classList.remove('over');
    col.ondrop=e=>{ e.preventDefault(); col.classList.remove('over'); setStage(e.dataTransfer.getData('text/plain'), col.dataset.stage); };
  });
}
function bindTaskRows(scope, after){
  scope.querySelectorAll('[data-done]').forEach(cb=>cb.onchange=async ()=>{ await tryApi(()=>api(`/api/tasks/${cb.dataset.done}`,{method:'PUT',body:{done:cb.checked}})); await refresh(); if(after) after(); });
  scope.querySelectorAll('[data-del-task]').forEach(b=>b.onclick=async ()=>{ if(!confirm('Delete this task?')) return; await tryApi(()=>api(`/api/tasks/${b.dataset.delTask}`,{method:'DELETE'})); await refresh(); if(after) after(); });
  scope.querySelectorAll('[data-open-deal]').forEach(a=>a.onclick=()=>openDetail('deal', a.dataset.openDeal));
  scope.querySelectorAll('[data-open-contact]').forEach(a=>a.onclick=()=>openDetail('contact', a.dataset.openContact));
}

async function setStage(id, stage){
  const d = byId(db.deals,id); if(!d || (d.stage===stage && !d.lost)) return;
  await tryApi(()=>api(`/api/deals/${id}/stage`,{method:'PATCH',body:{stage}}));
  await refresh(); toast(`${d.name} → ${stage}`);
}

/* ---------- drawer ---------- */
const drawer = document.getElementById('drawer'), scrim = document.getElementById('scrim');
function openDrawer(html){ drawer.innerHTML = html; drawer.classList.add('open'); scrim.classList.add('open'); drawer.setAttribute('aria-hidden','false'); drawer.scrollTop=0; const f=drawer.querySelector('input:not([type=checkbox]),select,textarea,button'); if(f) f.focus(); drawer.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeDrawer); }
function closeDrawer(){ drawer.classList.remove('open'); scrim.classList.remove('open'); drawer.setAttribute('aria-hidden','true'); }
scrim.onclick = closeDrawer;
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDrawer(); });
const dv = sel => (drawer.querySelector(sel)||{value:''}).value.trim();
const dhead = (title, sub='') => `<div class="dh"><div><h2>${title}</h2>${sub?`<div class="sub">${sub}</div>`:''}</div><button class="btn ghost" data-close>✕</button></div>`;

async function loadItems(d){
  const el = drawer.querySelector('#li-list'); if(!el) return;
  let items=[]; try{ items = await api(`/api/deals/${d.id}/items`); }catch(e){ el.innerHTML='<div class="empty">Couldn\'t load</div>'; return; }
  if(!items.length){ el.innerHTML = `<div class="empty">No line items. Pick from the rate card to build the deal value; the quote is generated from these.</div>`; return; }
  const one = items.filter(i=>i.billing!=='monthly'), mo = items.filter(i=>i.billing==='monthly');
  const row = i => `<tr data-item="${i.id}">
    <td><input class="li-name" value="${esc(i.name)}"><input class="li-desc" value="${esc(i.description||'')}" placeholder="Description" style="margin-top:3px;font-size:12px;color:var(--ink2)"></td>
    <td class="num"><input class="li-qty" type="number" min="0" step="any" value="${i.qty}" style="width:90px"></td>
    <td><select class="li-unit" style="width:80px">${['each','record','message','email','piece','month','1,000','hour'].map(u=>`<option ${u===i.unit?'selected':''}>${u}</option>`).join('')}</select></td>
    <td class="num"><input class="li-price" type="number" min="0" step="any" value="${i.unitPrice}" style="width:90px">${i.productId?`<div><button class="btn sm ghost li-tier" style="padding:0 4px;font-size:11px" title="Re-price from volume tiers">tier</button></div>`:''}</td>
    <td class="num">${i.billing==='monthly'?`<input class="li-months" type="number" min="1" max="60" value="${i.months}" style="width:60px"> mo`:'<span class="muted">one-time</span>'}</td>
    <td class="num"><b>${fmtMoney(i.amount)}</b></td>
    <td><button class="x li-del" title="Remove">✕</button></td></tr>`;
  el.innerHTML = `<table class="items"><thead><tr><th>Item</th><th class="num">Qty</th><th>Unit</th><th class="num">Rate</th><th class="num">Term</th><th class="num">Amount</th><th></th></tr></thead><tbody>
    ${one.map(row).join('')}${one.length?`<tr class="tot"><td colspan="5">One-time</td><td class="num">${fmtMoney(sum(one.map(i=>({value:i.amount}))))}</td><td></td></tr>`:''}
    ${mo.map(row).join('')}${mo.length?`<tr class="tot"><td colspan="5">Monthly (full term)</td><td class="num">${fmtMoney(sum(mo.map(i=>({value:i.amount}))))}</td><td></td></tr>`:''}
    <tr class="tot grand"><td colspan="5">Total program</td><td class="num">${fmtMoney(items.reduce((a,i)=>a+i.amount,0))}</td><td></td></tr>
  </tbody></table><div class="note" style="margin-top:6px">Edits save on blur. Rates default from the rate card tiers for the quantity entered; override freely.</div>`;
  el.querySelectorAll('tr[data-item]').forEach(tr=>{
    const id = tr.dataset.item;
    const save = async (body)=>{ await tryApi(()=>api(`/api/items/${id}`,{method:'PUT',body})); await refresh(); loadItems(d); refreshDealHeader(d.id); };
    tr.querySelector('.li-name').onchange = e=>save({name:e.target.value});
    tr.querySelector('.li-desc').onchange = e=>save({description:e.target.value});
    tr.querySelector('.li-qty').onchange = e=>save({qty:e.target.value, repriceFromTiers: true});
    tr.querySelector('.li-unit').onchange = e=>save({unit:e.target.value});
    tr.querySelector('.li-price').onchange = e=>save({unitPrice:e.target.value});
    const mo2 = tr.querySelector('.li-months'); if(mo2) mo2.onchange = e=>save({months:e.target.value});
    const tier = tr.querySelector('.li-tier'); if(tier) tier.onclick = ()=>save({repriceFromTiers:true});
    tr.querySelector('.li-del').onclick = async ()=>{ await tryApi(()=>api(`/api/items/${id}`,{method:'DELETE'})); await refresh(); loadItems(d); refreshDealHeader(d.id); };
  });
}
function refreshDealHeader(dealId){ const d=byId(db.deals,dealId); if(!d) return; const kv=drawer.querySelector('.kv span:nth-child(2)'); if(kv) kv.innerHTML = `${d.value?fmtMoney(d.value):'—'}${d.valueAuto?' <span class="muted" style="font-size:12px">from line items</span>':''}`; }

async function openSign(d){
  const c = byId(db.contacts,d.contactId);
  openDrawer(`${dhead('Send for signature', esc(d.name))}
    ${integrations.docusign ? '' : `<div class="warnbox">DocuSign isn't connected. An admin can set it up under Settings.</div>`}
    <div class="field"><label>Template</label><select id="s-template" ${integrations.docusign?'':'disabled'}><option value="">Loading templates…</option></select></div>
    <div id="s-roles"></div>
    <div class="field"><label>Email subject</label><input id="s-subject" value="27 Squared Marketing — ${esc(d.name)}"></div>
    <div class="row"><button class="btn primary" id="s-send" disabled>Send</button><button class="btn ghost" data-close>Cancel</button></div>`);
  if(!integrations.docusign) return;
  const sel = drawer.querySelector('#s-template');
  let templates = [];
  try{ templates = await api('/api/docusign/templates'); }
  catch(e){ sel.innerHTML = `<option value="">Couldn't load templates</option>`; toast(e.message, true); return; }
  sel.innerHTML = `<option value="">Choose a template</option>` + templates.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('');
  sel.onchange = async ()=>{
    const roles = drawer.querySelector('#s-roles'); roles.innerHTML = '<div class="empty">Loading roles…</div>';
    drawer.querySelector('#s-send').disabled = true;
    if(!sel.value){ roles.innerHTML=''; return; }
    try{
      const t = await api(`/api/docusign/templates/${encodeURIComponent(sel.value)}/roles`);
      if(t.emailSubject) drawer.querySelector('#s-subject').value = t.emailSubject;
      const signers = t.roles.filter(r=>r.type==='signer');
      if(!signers.length){ roles.innerHTML = '<div class="warnbox">This template has no signer roles.</div>'; return; }
      roles.innerHTML = signers.map((r,i)=>`<div class="section" style="margin-top:12px;padding-top:12px"><h3>${esc(r.roleName)}${i===0?' (client signer)':''}</h3>
        <div class="grid2"><div class="field"><label>Name</label><input data-role-name="${esc(r.roleName)}" value="${esc(i===0 ? (c?fullName(c):'') : r.name)}"></div>
        <div class="field"><label>Email</label><input type="email" data-role-email="${esc(r.roleName)}" value="${esc(i===0 ? (c?c.email:'') : r.email)}"></div></div></div>`).join('');
      drawer.querySelector('#s-send').disabled = false;
    }catch(e){ roles.innerHTML = `<div class="warnbox">${esc(e.message)}</div>`; }
  };
  drawer.querySelector('#s-send').onclick = async ()=>{
    const names = [...drawer.querySelectorAll('[data-role-name]')], emails = [...drawer.querySelectorAll('[data-role-email]')];
    const all = names.map((n,i)=>({ roleName:n.dataset.roleName, name:n.value.trim(), email:emails[i].value.trim() }));
    if(all.some(r=>!r.name||!r.email)){ toast('Every signer needs a name and email', true); return; }
    const [first, ...extra] = all;
    const btn = drawer.querySelector('#s-send'); btn.disabled = true; btn.textContent = 'Sending…';
    try{
      await api(`/api/deals/${d.id}/envelopes`,{method:'POST',body:{ templateId:sel.value, templateName: sel.options[sel.selectedIndex].text, roleName:first.roleName, signerName:first.name, signerEmail:first.email, extraRoles:extra, subject:dv('#s-subject') }});
      await refresh(); openDetail('deal', d.id); toast('Sent for signature');
    }catch(e){ toast(e.message, true); btn.disabled=false; btn.textContent='Send'; }
  };
}

/* ---------- CSV import ---------- */
function parseCSV(text){
  const rows=[]; let row=[], field='', inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){ if(ch==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQ=false; } else field+=ch; }
    else if(ch==='"') inQ=true;
    else if(ch===','){ row.push(field); field=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(field); rows.push(row); row=[]; field=''; }
    else field+=ch;
  }
  if(field!==''||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
const IMPORT_FIELDS = {
  contacts: [['first','First name',/^(first|fname|first ?name|given)/i],['last','Last name',/^(last|lname|last ?name|surname|family)/i],['email','Email',/e-?mail/i],['phone','Phone',/phone|mobile|cell|tel/i],['linkedin','LinkedIn URL',/linkedin/i],['title','Title',/^(title|job|position|role)/i],['company','Company',/company|organi[sz]ation|account|employer/i],['vertical','Vertical',/vertical|industry|segment/i],['source','Source',/source|lead ?source|channel/i],['value','Deal value',/value|amount|deal|revenue/i],['notes','Notes',/note|comment|description/i]],
  companies: [['name','Company name',/^(company|name|company ?name|organi[sz]ation|account)/i],['domain','Website / domain',/domain|website|url|web/i],['phone','Phone',/phone|tel/i],['vertical','Vertical',/vertical|industry|segment/i],['size','Size',/size|employees|headcount/i],['city','City',/city|town/i],['state','State',/state|province|region/i],['notes','Notes',/note|comment|description/i]],
};
const importFields = kind => [...IMPORT_FIELDS[kind], ...propsFor(kind==='contacts'?'contact':'company').map(p=>[`custom.${p.key}`, p.label+' (custom)', new RegExp('^'+p.label.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'$','i')])];
function openImport(kind){
  const fields = importFields(kind);
  openDrawer(`${dhead(`Import ${kind} from CSV`)}
    <p class="note">First row must be column headers. ${kind==='contacts'?'Rows with an email already in the CRM are skipped; company names are matched to existing companies or created.':'Existing company names are skipped.'}</p>
    <div class="field"><input type="file" id="i-file" accept=".csv,text/csv"></div>
    <div id="i-map"></div>`);
  drawer.querySelector('#i-file').onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      const rows = parseCSV(String(r.result).replace(/^﻿/,''));
      if(rows.length<2){ toast('No data rows found', true); return; }
      const headers = rows[0].map(h=>h.trim()), data = rows.slice(1);
      const guess = re => { const i = headers.findIndex(h=>re.test(h)); return i; };
      const map = drawer.querySelector('#i-map');
      map.innerHTML = `<p class="note"><b>${data.length}</b> rows, ${headers.length} columns. Map each CRM field to a column:</p>
        <table class="maptable"><tbody>${fields.map(([k,label,re])=>`<tr><td style="width:40%">${esc(label)}</td><td><select data-map="${k}"><option value="-1">— skip —</option>${headers.map((h,i)=>`<option value="${i}" ${guess(re)===i?'selected':''}>${esc(h)}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table>
        ${kind==='contacts'?`<div class="field" style="margin-top:12px"><label class="inline"><input type="checkbox" id="i-deals" checked> Create a deal for each imported contact</label></div>
        <div class="grid2"><div class="field"><label>Deal stage</label><select id="i-stage">${opts(stageNames(defaultPipe()),stageNames(defaultPipe())[0])}</select></div><div class="field"><label>Owner</label><select id="i-owner">${ownerOpts(me.id)}</select></div></div>`:''}
        <div class="field"><label>Preview (first 3 rows)</label><div class="preview" id="i-preview"></div></div>
        <div class="row"><button class="btn primary" id="i-go">Import ${data.length} rows</button></div>`;
      const build = ()=> data.map(row=>{ const o={custom:{}}; fields.forEach(([k])=>{ const i=Number(drawer.querySelector(`[data-map="${k}"]`).value); const val = i>=0 ? (row[i]||'').trim() : ''; if(k.startsWith('custom.')) o.custom[k.slice(7)]=val; else o[k]=val; }); return o; });
      const preview = ()=>{ drawer.querySelector('#i-preview').innerHTML = build().slice(0,3).map(o=>esc(Object.entries({...o, ...Object.fromEntries(Object.entries(o.custom).map(([k,v])=>['custom.'+k,v])), custom:''}).filter(([,v])=>v).map(([k,v])=>`${k}: ${v}`).join(' | ')||'(empty)')).join('<br>'); };
      map.querySelectorAll('select[data-map]').forEach(s=>s.onchange=preview); preview();
      drawer.querySelector('#i-go').onclick = async ()=>{
        const btn = drawer.querySelector('#i-go'); btn.disabled=true; btn.textContent='Importing…';
        try{
          const body = { rows: build() };
          if(kind==='contacts'){ body.createDeals = drawer.querySelector('#i-deals').checked; body.stage=dv('#i-stage'); body.ownerId=dv('#i-owner'); }
          const r = await api(`/api/import/${kind}`,{method:'POST',body});
          await refresh(); closeDrawer();
          toast(kind==='contacts' ? `Imported ${r.created} contacts (${r.skipped} skipped, ${r.companies} companies created, ${r.deals} deals)` : `Imported ${r.created} companies (${r.skipped} skipped)`);
        }catch(e){ toast(e.message, true); btn.disabled=false; btn.textContent='Import'; }
      };
    };
    r.readAsText(f);
  };
}
